name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain rust-toolchain.toml names
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked

  jupiter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jupiter
      - run: cargo fetch --locked
        working-directory: jupiter
      - run: cargo test --locked
        working-directory: jupiter
